name: party_game
description: "Arkadaş gruplarının tek telefondan oynadığı modern party game platformu."
publish_to: 'none'

# Mağaza sürümü: "sürüm+derleme". Her mağaza yüklemesinde derleme numarası
# (+ sonrası) artırılmalıdır.
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management: Riverpod.
  flutter_riverpod: ^2.5.1

  # Routing: go_router (ileride oda kodu / deep link için).
  go_router: ^14.2.0

  # Yerel veri kalıcılığı: oyuncu geçmişi ve uygulama tercihleri.
  shared_preferences: ^2.5.5

  # Oyun sırasında ekranın kararmasını engeller.
  wakelock_plus: ^1.4.0

  # "Uygulamayı Değerlendir" ve "Geri Bildirim" bağlantıları.
  url_launcher: ^6.3.2

  # Ayarlar ekranındaki sürüm bilgisi.
  package_info_plus: ^9.0.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Uygulama ikonu üretimi: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

  # Açılış (splash) ekranı üretimi: dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

# -----------------------------------------------------------------------------
# Uygulama ikonu (Neon Ink). Kaynak görseller assets/branding/ altında.
# Yeniden üretmek için: dart run flutter_launcher_icons
# -----------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  # iOS ikonlarında saydamlık olmamalı.
  remove_alpha_ios: true
  # Android 8+ uyarlanabilir ikon: koyu zemin + ön plan katmanı.
  adaptive_icon_background: "#0B0B12"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 21

# -----------------------------------------------------------------------------
# Açılış ekranı (Neon Ink koyu zemin + logo).
# Yeniden üretmek için: dart run flutter_native_splash:create
# -----------------------------------------------------------------------------
flutter_native_splash:
  color: "#0B0B12"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#0B0B12"
    image: "assets/branding/splash_logo.png"
  fullscreen: false
